<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pilot Request Received — PaintBharat Co.</title>
    <meta name="robots" content="noindex, nofollow">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../../css/styles.css">
    <style>
        body { background: #fafafa; display: flex; align-items: center; justify-content: center; min-height: 100vh; font-family: 'Inter', sans-serif; }
        .ty-wrap { max-width: 560px; width: 90%; text-align: center; padding: 64px 48px; background: #fff; border: 1px solid rgba(0,0,0,0.07); border-radius: 8px; }
        .ty-icon { width: 56px; height: 56px; border-radius: 50%; background: rgba(220,38,38,0.08); display: flex; align-items: center; justify-content: center; margin: 0 auto 32px; }
        .ty-icon svg { stroke: #DC2626; }
        .ty-eyebrow { font-size: 11px; font-weight: 700; letter-spacing: 0.15em; color: #DC2626; text-transform: uppercase; margin-bottom: 16px; display: block; }
        .ty-eyebrow::after { content: ''; display: block; width: 30px; height: 2px; background: #DC2626; margin: 8px auto 0; }
        .ty-wrap h1 { font-size: 28px; font-weight: 800; color: #1A1A1A; line-height: 1.2; margin-bottom: 20px; letter-spacing: -0.02em; }
        .ty-wrap p { font-size: 15px; color: #555; line-height: 1.7; margin-bottom: 40px; }
        .ty-divider { width: 40px; height: 2px; background: rgba(0,0,0,0.08); margin: 32px auto; }
        .ty-btn { display: inline-block; padding: 14px 28px; background: #1A1A1A; color: #fff; font-size: 13px; font-weight: 700; letter-spacing: 0.05em; text-decoration: none; border-radius: 4px; transition: background 0.2s; }
        .ty-btn:hover { background: #DC2626; }
        .ty-logo { width: 140px; height: auto; display: block; margin: 40px auto 0; opacity: 0.85; }
    </style>
</head>
<body>
    <div class="ty-wrap">
        <div class="ty-icon">
            <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
                <path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"></path>
                <polyline points="22 4 12 14.01 9 11.01"></polyline>
            </svg>
        </div>
        <span class="ty-eyebrow">Pilot Request Received</span>
        <h1>Thanks for reaching out!</h1>
        <p>We've received your pilot project request. A member of the PaintBharat team will review your requirements and contact you within 2 business days to schedule a site visit.</p>
        <div class="ty-divider"></div>
        <a href="/home" class="ty-btn">Back to Homepage</a>
        <img src="../../assets/logo-fullcolor.png" alt="PaintBharat Co." class="ty-logo">
    </div>
</body>
</html>
